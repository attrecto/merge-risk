name: merge-risk

# pull_request_target and workflow_run run this file and the action as they are on the base or
# default branch, so a PR can't rewrite the gate that judges it. Nothing here checks out or runs the PR's
# code. Reviews come in through merge-risk-review.yaml, since a review run on a fork PR can't write.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [merge-risk review]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: merge-risk-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # The base branch's copy of this repo, which is the action under test here. A workflow_run
      # event carries no PR, so that run takes the default branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: ./
